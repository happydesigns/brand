name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout id package
        uses: actions/checkout@v6
        with:
          repository: happydesigns/id
          token: ${{ secrets.HAPPYDESIGNS_ID_TOKEN || github.token }}
          path: id

      - name: Place id package for local dependency
        run: mv id ../id

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Build id package
        run: |
          pnpm --dir ../id install --frozen-lockfile --ignore-scripts --config.auto-install-peers=false
          pnpm --dir ../id --config.auto-install-peers=false build:package

      - name: Install dependencies
        run: pnpm install

      - name: Verify
        run: pnpm run verify
