name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout id package
        uses: actions/checkout@v6
        with:
          repository: happydesigns/id
          ref: 0e13c451db7e1d80ba21f1dc9125ad5119295e74
          token: ${{ secrets.HAPPYDESIGNS_ID_TOKEN || github.token }}
          path: id

      - name: Place id package for local dependency
        run: mv id ../id

      - name: Checkout course preview package
        uses: actions/checkout@v6
        with:
          repository: happydesigns/course
          ref: ec39daa29d45f8023f2f1c477b7c192389222bae
          path: course

      - name: Place course package for local dependency
        run: mv course ../course

      - name: Checkout booking preview package
        uses: actions/checkout@v6
        with:
          repository: happydesigns/booking
          ref: 36e435ddbdace473b860ea2b4d62bb83e23e9cce
          path: booking

      - name: Place booking package for local dependency
        run: mv booking ../booking

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Build id package
        run: |
          pnpm --dir ../id install --frozen-lockfile --ignore-scripts
          pnpm --dir ../id build:package

      - name: Build booking package
        run: |
          pnpm --dir ../booking install --frozen-lockfile --ignore-scripts
          pnpm --dir ../booking build

      - name: Build course core
        run: |
          pnpm --dir ../course install --frozen-lockfile --ignore-scripts
          pnpm --dir ../course --filter @happydesigns/course build

      - name: Install dependencies
        run: pnpm install

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm run verify
